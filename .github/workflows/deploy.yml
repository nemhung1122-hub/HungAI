name: Deploy HungAI Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy HungAI
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Show Wrangler error
        if: failure()
        run: |
          echo "===== WRANGLER STDERR ====="
          echo '${{ steps.deploy.outputs.command-stderr }}'
          echo "===== WRANGLER OUTPUT ====="
          echo '${{ steps.deploy.outputs.command-output }}'
