<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>HungAI</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      height: 100vh;
      background: #0b0f14;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #111720;
      border-bottom: 1px solid #252d38;
      font-size: 20px;
      font-weight: bold;
    }
    .status {
      margin-left: 10px;
      color: #4ade80;
      font-size: 12px;
      font-weight: normal;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
    }
    .ai {
      align-self: flex-start;
      background: #1b2430;
    }
    .error {
      align-self: flex-start;
      background: #7f1d1d;
    }
    .bottom {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #111720;
      border-top: 1px solid #252d38;
    }
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border: 1px solid #303b48;
      border-radius: 14px;
      background: #0b0f14;
      color: white;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }
    button {
      width: 80px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
    button:disabled {
      opacity: 0.5;
    }
    .clear {
      width: auto;
      padding: 0 12px;
      background: #252d38;
      font-size: 12px;
    }
  </style>
</head>
<body>
<header>
  HungAI
  <span class="status">● Online</span>
</header>
<main id="chat"></main>
<div class="bottom">
  <textarea
    id="input"
    placeholder="Nhập tin nhắn..."
  ></textarea>
  <button
    id="clear"
    class="clear"
  >
    Xóa
  </button>
  <button id="send">
    Gửi
  </button>
</div>
<script>
/*
 * ==========================================
 * HUNGAI FRONTEND
 * ==========================================
 */
const API_URL =
  "https://hungai-api.nemhung1122.workers.dev";
const STORAGE_KEY =
  "hungai_history";
/*
 * ==========================================
 * DOM
 * ==========================================
 */
const chat =
  document.getElementById("chat");
const input =
  document.getElementById("input");
const send =
  document.getElementById("send");
const clear =
  document.getElementById("clear");
/*
 * ==========================================
 * HISTORY
 * ==========================================
 */
let history = loadSavedHistory();
function loadSavedHistory() {
  try {
    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );
    if (!raw) {
      return [];
    }
    const parsed =
      JSON.parse(raw);
    if (!Array.isArray(parsed)) {
      return [];
    }
    return parsed
      .filter(item => {
        return (
          item &&
          (
            item.role === "user" ||
            item.role === "assistant"
          ) &&
          typeof item.content === "string" &&
          item.content.trim()
        );
      })
      .slice(-40);
  } catch (error) {
    console.warn(
      "HungAI: Không đọc được lịch sử cũ.",
      error
    );
    /*
     * Nếu localStorage bị hỏng,
     * xóa dữ liệu lỗi để app vẫn mở được.
     */
    try {
      localStorage.removeItem(
        STORAGE_KEY
      );
    } catch (_) {}
    return [];
  }
}
function saveHistory() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(history)
    );
  } catch (error) {
    console.warn(
      "HungAI: Không thể lưu lịch sử.",
      error
    );
  }
}
/*
 * ==========================================
 * HIỂN THỊ TIN NHẮN
 * ==========================================
 */
function addMessage(
  text,
  type
) {
  const div =
    document.createElement("div");
  div.className =
    "message " + type;
  div.textContent =
    String(text ?? "");
  chat.appendChild(div);
  chat.scrollTop =
    chat.scrollHeight;
  return div;
}
/*
 * ==========================================
 * LOAD CHAT
 * ==========================================
 */
function loadHistory() {
  chat.innerHTML = "";
  if (
    !Array.isArray(history) ||
    history.length === 0
  ) {
    addMessage(
      "Xin chào! Mình là HungAI. 👋",
      "ai"
    );
    return;
  }
  for (
    const item of history
  ) {
    if (
      !item ||
      typeof item.content !== "string"
    ) {
      continue;
    }
    addMessage(
      item.content,
      item.role === "user"
        ? "user"
        : "ai"
    );
  }
}
/*
 * ==========================================
 * KIỂM TRA API
 * ==========================================
 */
async function requestHungAI(
  message,
  chatHistory
) {
  const controller =
    new AbortController();
  /*
   * Nếu server không trả lời
   * trong 60 giây thì hủy request.
   */
  const timeout =
    setTimeout(
      () => controller.abort(),
      60000
    );
  try {
    const response =
      await fetch(
        API_URL,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            message,
            /*
             * Chỉ gửi 12 tin gần nhất.
             */
            history:
              chatHistory
                .filter(item =>
                  item &&
                  (
                    item.role === "user" ||
                    item.role === "assistant"
                  ) &&
                  typeof item.content === "string"
                )
                .slice(-12)
          }),
          signal:
            controller.signal
        }
      );
    /*
     * Đọc response an toàn.
     */
    const text =
      await response.text();
    let data = null;
    try {
      data =
        text
          ? JSON.parse(text)
          : null;
    } catch (_) {
      throw new Error(
        "Máy chủ trả về dữ liệu không hợp lệ."
      );
    }
    if (!response.ok) {
      throw new Error(
        data?.error ||
        `Máy chủ lỗi HTTP ${response.status}.`
      );
    }
    if (
      !data ||
      typeof data.reply !== "string" ||
      !data.reply.trim()
    ) {
      throw new Error(
        "HungAI chưa nhận được câu trả lời từ mô hình."
      );
    }
    return data.reply;
  } catch (error) {
    if (
      error?.name === "AbortError"
    ) {
      throw new Error(
        "HungAI phản hồi quá lâu. Hãy thử lại."
      );
    }
    if (
      error instanceof TypeError
    ) {
      throw new Error(
        "Không thể kết nối tới máy chủ HungAI. Hãy kiểm tra mạng hoặc thử lại."
      );
    }
    throw error;
  } finally {
    clearTimeout(timeout);
  }
}
/*
 * ==========================================
 * GỬI TIN NHẮN
 * ==========================================
 */
async function sendMessage() {
  const message =
    input.value.trim();
  if (
    !message ||
    send.disabled
  ) {
    return;
  }
  /*
   * Hiển thị câu người dùng.
   */
  addMessage(
    message,
    "user"
  );
  /*
   * Xóa ô nhập.
   */
  input.value = "";
  /*
   * Khóa nút gửi.
   */
  send.disabled = true;
  /*
   * Hiển thị trạng thái.
   */
  const thinking =
    addMessage(
      "HungAI đang suy nghĩ...",
      "ai"
    );
  try {
    /*
     * Lưu history hiện tại
     * trước khi thêm câu mới.
     *
     * Như vậy Worker không nhận
     * câu user bị gửi hai lần.
     */
    const historyForRequest =
      history.slice(-12);
    const reply =
      await requestHungAI(
        message,
        historyForRequest
      );
    /*
     * Xóa trạng thái đang suy nghĩ.
     */
    thinking.remove();
    /*
     * Hiển thị câu trả lời.
     */
    addMessage(
      reply,
      "ai"
    );
    /*
     * Chỉ lưu lịch sử
     * sau khi AI trả lời thành công.
     */
    history.push({
      role: "user",
      content: message
    });
    history.push({
      role: "assistant",
      content: reply
    });
    /*
     * Giới hạn lịch sử.
     */
    if (
      history.length > 40
    ) {
      history =
        history.slice(-40);
    }
    saveHistory();
  } catch (error) {
    /*
     * Xóa "đang suy nghĩ".
     */
    thinking.remove();
    /*
     * Hiển thị lỗi.
     */
    addMessage(
      "Lỗi: " +
      (
        error?.message ||
        "Không xác định."
      ),
      "error"
    );
  } finally {
    send.disabled = false;
    input.focus();
  }
}
/*
 * ==========================================
 * XÓA LỊCH SỬ
 * ==========================================
 */
clear.addEventListener(
  "click",
  function() {
    history = [];
    try {
      localStorage.removeItem(
        STORAGE_KEY
      );
    } catch (_) {}
    loadHistory();
    input.focus();
  }
);
/*
 * ==========================================
 * NÚT GỬI
 * ==========================================
 */
send.addEventListener(
  "click",
  sendMessage
);
/*
 * ==========================================
 * ENTER
 * ==========================================
 */
input.addEventListener(
  "keydown",
  function(event) {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);
/*
 * ==========================================
 * KHỞI ĐỘNG
 * ==========================================
 */
loadHistory();
input.focus();
</script>
</body>
</html>
