<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="theme-color"
    content="#0b0f14"
  >
  <title>HungAI</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0f14;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      min-height: 60px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #111720;
      border-bottom:
        1px solid #252d38;
      font-size: 20px;
      font-weight: bold;
    }
    .status {
      margin-left: 10px;
      color: #4ade80;
      font-size: 12px;
      font-weight: normal;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
    }
    .ai {
      align-self: flex-start;
      background: #1b2430;
    }
    .error {
      align-self: flex-start;
      background: #7f1d1d;
    }
    .bottom {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #111720;
      border-top:
        1px solid #252d38;
      padding-bottom:
        calc(
          12px + env(safe-area-inset-bottom)
        );
    }
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border:
        1px solid #303b48;
      border-radius: 14px;
      background: #0b0f14;
      color: #ffffff;
      padding: 13px;
      font-size: 15px;
      outline: none;
      font-family: Arial, sans-serif;
    }
    textarea:focus {
      border-color: #2563eb;
    }
    button {
      width: 80px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .clear {
      width: auto;
      padding: 0 12px;
      background: #252d38;
      font-size: 12px;
    }
  </style>
</head>
<body>
<header>
  HungAI
  <span
    id="status"
    class="status"
  >
    ● Online
  </span>
</header>
<main id="chat"></main>
<div class="bottom">
  <textarea
    id="input"
    placeholder="Nhập tin nhắn..."
    autocomplete="off"
    spellcheck="false"
  ></textarea>
  <button
    id="clear"
    class="clear"
    type="button"
  >
    Xóa
  </button>
  <button
    id="send"
    type="button"
  >
    Gửi
  </button>
</div>
<script>
/*
 * ==========================================
 * HUNGAI FRONTEND
 * ==========================================
 */
const API_URL =
  "https://hungai-api.nemhung1122.workers.dev";
const STORAGE_KEY =
  "hungai_history";
const chat =
  document.getElementById("chat");
const input =
  document.getElementById("input");
const send =
  document.getElementById("send");
const clear =
  document.getElementById("clear");
const status =
  document.getElementById("status");
/*
 * ==========================================
 * LỊCH SỬ
 * ==========================================
 */
let history =
  loadSavedHistory();
function loadSavedHistory() {
  try {
    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );
    if (!raw) {
      return [];
    }
    const parsed =
      JSON.parse(raw);
    if (!Array.isArray(parsed)) {
      return [];
    }
    return parsed
      .filter(item => {
        return (
          item &&
          (
            item.role === "user" ||
            item.role === "assistant"
          ) &&
          typeof item.content === "string" &&
          item.content.trim()
        );
      })
      .slice(-40);
  } catch (error) {
    console.warn(
      "HungAI: Không đọc được lịch sử.",
      error
    );
    try {
      localStorage.removeItem(
        STORAGE_KEY
      );
    } catch (_) {}
    return [];
  }
}
function saveHistory() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(history)
    );
  } catch (error) {
    console.warn(
      "HungAI: Không thể lưu lịch sử.",
      error
    );
  }
}
/*
 * ==========================================
 * HIỂN THỊ TIN NHẮN
 * ==========================================
 */
function addMessage(
  text,
  type
) {
  const div =
    document.createElement("div");
  div.className =
    "message " + type;
  div.textContent =
    String(text ?? "");
  chat.appendChild(div);
  chat.scrollTop =
    chat.scrollHeight;
  return div;
}
/*
 * ==========================================
 * LOAD CHAT
 * ==========================================
 */
function loadHistory() {
  chat.innerHTML = "";
  if (
    !Array.isArray(history) ||
    history.length === 0
  ) {
    addMessage(
      "Xin chào! Mình là HungAI. 👋",
      "ai"
    );
    return;
  }
  for (
    const item of history
  ) {
    if (
      !item ||
      typeof item.content !== "string"
    ) {
      continue;
    }
    addMessage(
      item.content,
      item.role === "user"
        ? "user"
        : "ai"
    );
  }
}
/*
 * ==========================================
 * GỌI HUNGAI
 *
 * Dùng XMLHttpRequest thay fetch().
 *
 * Lý do:
 * Trên một số phiên bản Safari/iOS,
 * fetch() có thể trả "Load failed"
 * dù request đã tới Cloudflare.
 * ==========================================
 */
function requestHungAI(
  message,
  chatHistory
) {
  return new Promise(
    function(resolve, reject) {
      const xhr =
        new XMLHttpRequest();
      let finished = false;
      /*
       * 60 giây timeout.
       */
      xhr.timeout = 60000;
      /*
       * ======================================
       * TIMEOUT
       * ======================================
       */
      xhr.ontimeout =
        function() {
          if (finished) {
            return;
          }
          finished = true;
          reject(
            new Error(
              "HungAI phản hồi quá lâu. Hãy thử lại."
            )
          );
        };
      /*
       * ======================================
       * NETWORK ERROR
       * ======================================
       */
      xhr.onerror =
        function() {
          if (finished) {
            return;
          }
          finished = true;
          reject(
            new Error(
              "Không thể kết nối tới máy chủ HungAI. Request không hoàn tất."
            )
          );
        };
      /*
       * ======================================
       * ABORT
       * ======================================
       */
      xhr.onabort =
        function() {
          if (finished) {
            return;
          }
          finished = true;
          reject(
            new Error(
              "Kết nối tới HungAI đã bị hủy."
            )
          );
        };
      /*
       * ======================================
       * RESPONSE
       * ======================================
       */
      xhr.onload =
        function() {
          if (finished) {
            return;
          }
          finished = true;
          const statusCode =
            xhr.status;
          const responseText =
            xhr.responseText || "";
          /*
           * HTTP lỗi
           */
          if (
            statusCode < 200 ||
            statusCode >= 300
          ) {
            let errorMessage =
              "Máy chủ lỗi HTTP " +
              statusCode +
              ".";
            try {
              const errorData =
                JSON.parse(
                  responseText
                );
              if (
                errorData &&
                typeof errorData.error ===
                  "string"
              ) {
                errorMessage =
                  errorData.error;
              }
            } catch (_) {}
            reject(
              new Error(
                errorMessage
              )
            );
            return;
          }
          /*
           * JSON
           */
          let data;
          try {
            data =
              JSON.parse(
                responseText
              );
          } catch (_) {
            reject(
              new Error(
                "Máy chủ HungAI trả về dữ liệu không hợp lệ."
              )
            );
            return;
          }
          /*
           * Kiểm tra reply
           */
          if (
            !data ||
            typeof data.reply !== "string" ||
            !data.reply.trim()
          ) {
            reject(
              new Error(
                "HungAI chưa nhận được câu trả lời từ mô hình."
              )
            );
            return;
          }
          resolve(
            data.reply
          );
        };
      /*
       * ======================================
       * OPEN
       * ======================================
       */
      try {
        xhr.open(
          "POST",
          API_URL,
          true
        );
        /*
         * Không cache request.
         */
        xhr.setRequestHeader(
          "Content-Type",
          "application/json"
        );
        xhr.setRequestHeader(
          "Accept",
          "application/json"
        );
        /*
         * ====================================
         * HISTORY
         * ====================================
         */
        const safeHistory =
          Array.isArray(chatHistory)
            ? chatHistory
                .filter(item => {
                  return (
                    item &&
                    (
                      item.role === "user" ||
                      item.role === "assistant"
                    ) &&
                    typeof item.content ===
                      "string"
                  );
                })
                .slice(-12)
            : [];
        /*
         * ====================================
         * BODY
         * ====================================
         */
        const body =
          JSON.stringify({
            message,
            history:
              safeHistory
          });
        /*
         * ====================================
         * SEND
         * ====================================
         */
        xhr.send(
          body
        );
      } catch (error) {
        if (finished) {
          return;
        }
        finished = true;
        reject(
          new Error(
            error?.message ||
            "Không thể gửi yêu cầu tới HungAI."
          )
        );
      }
    }
  );
}
/*
 * ==========================================
 * GỬI TIN NHẮN
 * ==========================================
 */
async function sendMessage() {
  const message =
    input.value.trim();
  if (
    !message ||
    send.disabled
  ) {
    return;
  }
  /*
   * Hiển thị user.
   */
  addMessage(
    message,
    "user"
  );
  /*
   * Xóa input.
   */
  input.value = "";
  /*
   * Khóa nút.
   */
  send.disabled = true;
  clear.disabled = true;
  /*
   * Trạng thái.
   */
  status.textContent =
    "● Đang xử lý...";
  status.style.color =
    "#facc15";
  /*
   * Thinking.
   */
  const thinking =
    addMessage(
      "HungAI đang suy nghĩ...",
      "ai"
    );
  try {
    /*
     * Chỉ gửi lịch sử CŨ.
     *
     * Câu user hiện tại chưa thêm vào
     * history cho tới khi AI trả lời.
     */
    const historyForRequest =
      history.slice(-12);
    /*
     * Gọi API.
     */
    const reply =
      await requestHungAI(
        message,
        historyForRequest
      );
    /*
     * Xóa thinking.
     */
    thinking.remove();
    /*
     * Hiển thị AI.
     */
    addMessage(
      reply,
      "ai"
    );
    /*
     * Lưu lịch sử.
     */
    history.push({
      role: "user",
      content: message
    });
    history.push({
      role: "assistant",
      content: reply
    });
    /*
     * Giới hạn 40 message.
     */
    if (
      history.length > 40
    ) {
      history =
        history.slice(-40);
    }
    saveHistory();
    /*
     * Online.
     */
    status.textContent =
      "● Online";
    status.style.color =
      "#4ade80";
  } catch (error) {
    /*
     * Xóa thinking.
     */
    thinking.remove();
    /*
     * Hiển thị lỗi thật.
     */
    addMessage(
      "Lỗi: " +
      (
        error?.message ||
        "Không xác định."
      ),
      "error"
    );
    /*
     * Trạng thái lỗi.
     */
    status.textContent =
      "● Lỗi kết nối";
    status.style.color =
      "#ef4444";
  } finally {
    send.disabled =
      false;
    clear.disabled =
      false;
    input.focus();
  }
}
/*
 * ==========================================
 * XÓA LỊCH SỬ
 * ==========================================
 */
clear.addEventListener(
  "click",
  function() {
    history = [];
    try {
      localStorage.removeItem(
        STORAGE_KEY
      );
    } catch (_) {}
    loadHistory();
    input.focus();
  }
);
/*
 * ==========================================
 * NÚT GỬI
 * ==========================================
 */
send.addEventListener(
  "click",
  sendMessage
);
/*
 * ==========================================
 * ENTER
 * ==========================================
 */
input.addEventListener(
  "keydown",
  function(event) {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);
/*
 * ==========================================
 * KHỞI ĐỘNG
 * ==========================================
 */
loadHistory();
input.focus();
</script>
</body>
</html>
