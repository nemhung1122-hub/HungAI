<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>HungAI</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }
    body {
      background: #0b0f14;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #111720;
      border-bottom:
        1px solid #252d38;
      font-size: 20px;
      font-weight: bold;
    }
    .status {
      margin-left: 10px;
      color: #4ade80;
      font-size: 12px;
      font-weight: normal;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
    }
    .ai {
      align-self: flex-start;
      background: #1b2430;
    }
    .error {
      align-self: flex-start;
      background: #7f1d1d;
    }
    .bottom {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #111720;
      border-top:
        1px solid #252d38;
    }
    textarea {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border:
        1px solid #303b48;
      border-radius: 14px;
      background: #0b0f14;
      color: #ffffff;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }
    textarea:focus {
      border-color: #2563eb;
    }
    button {
      width: 80px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>
<body>
<header>
  HungAI
  <span class="status">
    ● Online
  </span>
</header>
<main id="chat"></main>
<div class="bottom">
  <textarea
    id="input"
    placeholder="Nhập tin nhắn..."
  ></textarea>
  <button
    id="send"
    type="button"
  >
    Gửi
  </button>
</div>
<script>
const API_URL =
  "https://hungai-api.nemhung1122.workers.dev/";
const chat =
  document.getElementById("chat");
const input =
  document.getElementById("input");
const send =
  document.getElementById("send");
function addMessage(
  text,
  type
) {
  const div =
    document.createElement("div");
  div.className =
    "message " + type;
  div.textContent =
    String(text);
  chat.appendChild(div);
  chat.scrollTop =
    chat.scrollHeight;
  return div;
}
async function sendMessage() {
  const message =
    input.value.trim();
  if (
    !message ||
    send.disabled
  ) {
    return;
  }
  addMessage(
    message,
    "user"
  );
  input.value = "";
  send.disabled = true;
  const thinking =
    addMessage(
      "HungAI đang suy nghĩ...",
      "ai"
    );
  try {
    const response =
      await fetch(
        API_URL,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              message,
              history: []
            })
        }
      );
    const raw =
      await response.text();
    let data;
    try {
      data =
        JSON.parse(raw);
    } catch {
      throw new Error(
        `Worker trả dữ liệu không hợp lệ. HTTP ${response.status}`
      );
    }
    if (!response.ok) {
      throw new Error(
        data?.error ||
        `Worker lỗi HTTP ${response.status}`
      );
    }
    if (
      typeof data?.reply !== "string" ||
      !data.reply.trim()
    ) {
      throw new Error(
        data?.error ||
        "Worker không trả về câu trả lời."
      );
    }
    thinking.remove();
    addMessage(
      data.reply,
      "ai"
    );
  } catch (error) {
    thinking.remove();
    console.error(
      "HungAI:",
      error
    );
    addMessage(
      "Lỗi: " +
      (
        error?.message ||
        "Không xác định."
      ),
      "error"
    );
  } finally {
    send.disabled = false;
    input.focus();
  }
}
send.addEventListener(
  "click",
  sendMessage
);
input.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);
addMessage(
  "Xin chào! Mình là HungAI. 👋",
  "ai"
);
input.focus();
</script>
</body>
</html>
