<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>HungAI</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      height: 100vh;
      background: #0b0f14;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #111720;
      border-bottom: 1px solid #252d38;
      font-size: 20px;
      font-weight: bold;
    }
    .status {
      margin-left: 10px;
      color: #4ade80;
      font-size: 12px;
      font-weight: normal;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
    }
    .ai {
      align-self: flex-start;
      background: #1b2430;
    }
    .error {
      align-self: flex-start;
      background: #7f1d1d;
    }
    .bottom {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #111720;
      border-top: 1px solid #252d38;
    }
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border: 1px solid #303b48;
      border-radius: 14px;
      background: #0b0f14;
      color: white;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }
    button {
      width: 80px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
    button:disabled {
      opacity: 0.5;
    }
    .clear {
      width: auto;
      padding: 0 12px;
      background: #252d38;
      font-size: 12px;
    }
  </style>
</head>
<body>
<header>
  HungAI
  <span class="status">
    ● Online
  </span>
</header>
<main id="chat"></main>
<div class="bottom">
  <textarea
    id="input"
    placeholder="Nhập tin nhắn..."
  ></textarea>
  <button
    id="clear"
    class="clear"
  >
    Xóa
  </button>
  <button id="send">
    Gửi
  </button>
</div>
<script>
const API_URL =
  "https://hungai-api.nemhung1122.workers.dev/";
const STORAGE_KEY =
  "hungai_history";
const chat =
  document.getElementById("chat");
const input =
  document.getElementById("input");
const send =
  document.getElementById("send");
const clear =
  document.getElementById("clear");
/*
 * ========================================
 * HISTORY
 * ========================================
 */
let history = loadHistory();
function loadHistory() {
  try {
    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );
    if (!raw) {
      return [];
    }
    const data =
      JSON.parse(raw);
    if (!Array.isArray(data)) {
      return [];
    }
    return data
      .filter(item =>
        item &&
        (
          item.role === "user" ||
          item.role === "assistant"
        ) &&
        typeof item.content === "string" &&
        item.content.trim()
      )
      .slice(-40);
  } catch {
    return [];
  }
}
function saveHistory() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(history)
    );
  } catch (error) {
    console.error(
      "HungAI history error:",
      error
    );
  }
}
/*
 * ========================================
 * MESSAGE UI
 * ========================================
 */
function addMessage(
  text,
  type
) {
  const div =
    document.createElement("div");
  div.className =
    "message " + type;
  div.textContent =
    String(text ?? "");
  chat.appendChild(div);
  chat.scrollTop =
    chat.scrollHeight;
  return div;
}
/*
 * ========================================
 * LOAD CHAT
 * ========================================
 */
function loadChat() {
  chat.innerHTML = "";
  if (
    history.length === 0
  ) {
    addMessage(
      "Xin chào! Mình là HungAI. 👋",
      "ai"
    );
    return;
  }
  for (
    const item of history
  ) {
    addMessage(
      item.content,
      item.role === "user"
        ? "user"
        : "ai"
    );
  }
}
/*
 * ========================================
 * CALL WORKER
 * ========================================
 */
async function callHungAI(
  message,
  previousHistory
) {
  let response;
  try {
    response =
      await fetch(
        API_URL,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              message,
              history:
                previousHistory
                  .slice(-12)
            })
        }
      );
  } catch (error) {
    console.error(
      "FETCH ERROR:",
      error
    );
    throw new Error(
      "Không kết nối được tới Worker. Hãy kiểm tra mạng hoặc URL Worker."
    );
  }
  const text =
    await response.text();
  let data;
  try {
    data =
      JSON.parse(text);
  } catch {
    console.error(
      "INVALID JSON:",
      text
    );
    throw new Error(
      `Worker trả dữ liệu không hợp lệ. HTTP ${response.status}`
    );
  }
  if (!response.ok) {
    throw new Error(
      data?.error ||
      `Worker lỗi HTTP ${response.status}`
    );
  }
  if (
    typeof data?.reply !== "string" ||
    !data.reply.trim()
  ) {
    console.error(
      "BAD RESPONSE:",
      data
    );
    throw new Error(
      data?.error ||
      "Worker không trả về câu trả lời."
    );
  }
  return data.reply;
}
/*
 * ========================================
 * SEND
 * ========================================
 */
async function sendMessage() {
  const message =
    input.value.trim();
  if (
    !message ||
    send.disabled
  ) {
    return;
  }
  /*
   * Hiển thị user.
   */
  addMessage(
    message,
    "user"
  );
  input.value = "";
  send.disabled = true;
  const thinking =
    addMessage(
      "HungAI đang suy nghĩ...",
      "ai"
    );
  /*
   * Quan trọng:
   *
   * Gửi history CŨ.
   *
   * Sau khi AI trả lời thành công
   * mới thêm message mới vào history.
   */
  const historyForRequest =
    history.slice(-12);
  try {
    const reply =
      await callHungAI(
        message,
        historyForRequest
      );
    thinking.remove();
    addMessage(
      reply,
      "ai"
    );
    /*
     * Lưu cả câu hỏi và câu trả lời.
     */
    history.push({
      role: "user",
      content: message
    });
    history.push({
      role: "assistant",
      content: reply
    });
    /*
     * Tối đa 40 message.
     */
    if (
      history.length > 40
    ) {
      history =
        history.slice(-40);
    }
    saveHistory();
  } catch (error) {
    thinking.remove();
    console.error(
      "HungAI ERROR:",
      error
    );
    addMessage(
      "Lỗi: " +
      (
        error?.message ||
        "Không xác định."
      ),
      "error"
    );
  } finally {
    send.disabled = false;
    input.focus();
  }
}
/*
 * ========================================
 * CLEAR
 * ========================================
 */
clear.addEventListener(
  "click",
  () => {
    history = [];
    try {
      localStorage.removeItem(
        STORAGE_KEY
      );
    } catch {}
    loadChat();
    input.focus();
  }
);
/*
 * ========================================
 * BUTTON
 * ========================================
 */
send.addEventListener(
  "click",
  sendMessage
);
/*
 * ========================================
 * ENTER
 * ========================================
 */
input.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);
/*
 * ========================================
 * START
 * ========================================
 */
loadChat();
input.focus();
</script>
</body>
</html>
