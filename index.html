<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HungAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #111720;
      border-bottom: 1px solid #252d38;
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      margin-left: 10px;
      font-size: 12px;
      color: #4ade80;
      font-weight: normal;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
    }

    .ai {
      align-self: flex-start;
      background: #1b2430;
    }

    .error {
      background: #7f1d1d;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #111720;
      border-top: 1px solid #252d38;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 150px;
      border: 1px solid #303b48;
      border-radius: 12px;
      background: #0b0f14;
      color: white;
      padding: 13px;
      outline: none;
      font-size: 15px;
    }

    button {
      width: 80px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <header>
    HungAI
    <span class="status">● Cloudflare AI</span>
  </header>

  <main id="chat">
    <div class="message ai">
      Xin chào! Tôi là HungAI. Bạn muốn hỏi gì?
    </div>
  </main>

  <div class="input-area">
    <textarea
      id="message"
      placeholder="Nhập tin nhắn..."
      rows="1"
    ></textarea>

    <button id="send">Gửi</button>
  </div>

  <script>
    const API_URL = "https://hungai-api.nemhung1122.workers.dev";

    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message || sendButton.disabled) {
        return;
      }

      addMessage(message, "user");

      input.value = "";
      sendButton.disabled = true;
      sendButton.textContent = "...";

      const thinking = addMessage("HungAI đang suy nghĩ...", "ai");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        thinking.remove();

        if (!response.ok) {
          throw new Error(data.error || "API HungAI trả về lỗi.");
        }

        addMessage(
          data.reply || "HungAI không nhận được câu trả lời.",
          "ai"
        );

      } catch (error) {
        thinking.remove();

        addMessage(
          "Lỗi kết nối HungAI: " + error.message,
          "ai error"
        );
      }

      sendButton.disabled = false;
      sendButton.textContent = "Gửi";

      input.focus();
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>

</body>
</html>
