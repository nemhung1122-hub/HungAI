<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HungAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: #0b0f14;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #111720;
      border-bottom: 1px solid #252d38;
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      margin-left: 10px;
      color: #4ade80;
      font-size: 12px;
      font-weight: normal;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
    }

    .ai {
      align-self: flex-start;
      background: #1b2430;
    }

    .error {
      background: #7f1d1d;
    }

    .bottom {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #111720;
      border-top: 1px solid #252d38;
    }

    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border: 1px solid #303b48;
      border-radius: 14px;
      background: #0b0f14;
      color: white;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    button {
      width: 80px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
    }

    .clear {
      width: auto;
      padding: 0 12px;
      background: #252d38;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  HungAI
  <span class="status">● Online</span>
</header>

<main id="chat"></main>

<div class="bottom">

  <textarea
    id="input"
    placeholder="Nhập tin nhắn..."
  ></textarea>

  <button
    id="clear"
    class="clear"
  >
    Xóa
  </button>

  <button id="send">
    Gửi
  </button>

</div>

<script>

const API_URL =
  "https://hungai-api.nemhung1122.workers.dev";

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const clear =
  document.getElementById("clear");


let history =
  JSON.parse(
    localStorage.getItem("hungai_history") ||
    "[]"
  );


function saveHistory() {

  localStorage.setItem(
    "hungai_history",
    JSON.stringify(history)
  );

}


function addMessage(text, type) {

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

  return div;

}


function loadHistory() {

  chat.innerHTML = "";

  if (history.length === 0) {

    addMessage(
      "Xin chào! Mình là HungAI. 👋",
      "ai"
    );

    return;
  }

  for (const item of history) {

    addMessage(
      item.content,
      item.role === "user"
        ? "user"
        : "ai"
    );

  }

}


async function sendMessage() {

  const message =
    input.value.trim();

  if (
    !message ||
    send.disabled
  ) {
    return;
  }


  addMessage(
    message,
    "user"
  );


  input.value = "";

  send.disabled = true;


  const thinking =
    addMessage(
      "HungAI đang suy nghĩ...",
      "ai"
    );


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            message,

            history

          })

        }
      );


    const data =
      await response.json();


    thinking.remove();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "HungAI gặp lỗi."
      );

    }


    if (!data.reply) {

      throw new Error(
        "Không nhận được câu trả lời."
      );

    }


    let reply =
      data.reply;


    /*
     * Phòng trường hợp model
     * trả JSON thay vì text.
     */

    if (
      typeof reply === "string"
    ) {

      try {

        const parsed =
          JSON.parse(reply);

        const content =
          parsed
            ?.choices?.[0]
            ?.message?.content;

        if (
          typeof content === "string" &&
          content.trim()
        ) {

          reply = content;

        }

      } catch (_) {}

    }


    addMessage(
      reply,
      "ai"
    );


    history.push({
      role: "user",
      content: message
    });


    history.push({
      role: "assistant",
      content: reply
    });


    if (history.length > 40) {

      history =
        history.slice(-40);

    }


    saveHistory();


  } catch (error) {

    thinking.remove();

    addMessage(
      "Lỗi: " +
      error.message,
      "error"
    );

  }


  send.disabled = false;

  input.focus();

}


send.addEventListener(
  "click",
  sendMessage
);


clear.addEventListener(
  "click",
  function() {

    history = [];

    saveHistory();

    loadHistory();

  }
);


input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


loadHistory();

</script>

</body>
</html>
