<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f14">
  <title>HungAI</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b0f14;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #111720;
      border-bottom: 1px solid #252d38;
      font-size: 20px;
      font-weight: bold;
    }
    .online {
      margin-left: 10px;
      color: #4ade80;
      font-size: 12px;
      font-weight: normal;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .message {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
    }
    .ai {
      align-self: flex-start;
      background: #1b2430;
    }
    .error {
      align-self: flex-start;
      background: #7f1d1d;
    }
    .thinking {
      opacity: 0.7;
    }
    .bottom {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #111720;
      border-top: 1px solid #252d38;
    }
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 140px;
      resize: none;
      border: 1px solid #303b48;
      border-radius: 14px;
      background: #0b0f14;
      color: white;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }
    textarea:focus {
      border-color: #2563eb;
    }
    button {
      min-width: 70px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      padding: 0 12px;
    }
    button:disabled {
      opacity: 0.5;
    }
    #clear {
      background: #252d38;
      min-width: 55px;
      font-size: 12px;
    }
  </style>
</head>
<body>
<header>
  HungAI
  <span class="online">● Online</span>
</header>
<main id="chat"></main>
<div class="bottom">
  <textarea
    id="input"
    placeholder="Nhập tin nhắn..."
    autocomplete="off"
    autocorrect="on"
    spellcheck="true"
  ></textarea>
  <button id="clear">
    Xóa
  </button>
  <button id="send">
    Gửi
  </button>
</div>
<script>
/* ==================================================
   CONFIG
================================================== */
const API_URL =
  "https://hungai-api.nemhung1122.workers.dev";
const HISTORY_KEY =
  "hungai_history_v1";
const PENDING_KEY =
  "hungai_pending_v1";
/* ==================================================
   ELEMENTS
================================================== */
const chat =
  document.getElementById("chat");
const input =
  document.getElementById("input");
const send =
  document.getElementById("send");
const clear =
  document.getElementById("clear");
/* ==================================================
   STATE
================================================== */
let history = loadHistory();
let pendingJobs = loadPendingJobs();
let sending = false;
/* ==================================================
   STORAGE
================================================== */
function loadHistory() {
  try {
    const raw =
      localStorage.getItem(HISTORY_KEY);
    if (!raw) {
      return [];
    }
    const data =
      JSON.parse(raw);
    if (!Array.isArray(data)) {
      return [];
    }
    return data
      .filter(item =>
        item &&
        (
          item.role === "user" ||
          item.role === "assistant"
        ) &&
        typeof item.content === "string"
      )
      .slice(-100);
  } catch (error) {
    console.error(
      "LOAD HISTORY:",
      error
    );
    return [];
  }
}
function saveHistory() {
  try {
    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(
        history.slice(-100)
      )
    );
  } catch (error) {
    console.error(
      "SAVE HISTORY:",
      error
    );
  }
}
function loadPendingJobs() {
  try {
    const raw =
      localStorage.getItem(PENDING_KEY);
    if (!raw) {
      return [];
    }
    const data =
      JSON.parse(raw);
    return Array.isArray(data)
      ? data
      : [];
  } catch (error) {
    console.error(
      "LOAD PENDING:",
      error
    );
    return [];
  }
}
function savePendingJobs() {
  try {
    localStorage.setItem(
      PENDING_KEY,
      JSON.stringify(pendingJobs)
    );
  } catch (error) {
    console.error(
      "SAVE PENDING:",
      error
    );
  }
}
/* ==================================================
   UI
================================================== */
function addMessage(
  text,
  type,
  extraClass = ""
) {
  const element =
    document.createElement("div");
  element.className =
    `message ${type} ${extraClass}`;
  element.textContent =
    String(text ?? "");
  chat.appendChild(element);
  chat.scrollTop =
    chat.scrollHeight;
  return element;
}
function renderChat() {
  chat.innerHTML = "";
  if (!history.length) {
    addMessage(
      "Xin chào! Mình là HungAI. 👋",
      "ai"
    );
    return;
  }
  for (const item of history) {
    addMessage(
      item.content,
      item.role === "user"
        ? "user"
        : "ai"
    );
  }
}
/* ==================================================
   NETWORK
================================================== */
async function requestJSON(
  url,
  options = {}
) {
  const response =
    await fetch(
      url,
      {
        ...options,
        cache: "no-store"
      }
    );
  const text =
    await response.text();
  let data;
  try {
    data =
      text
        ? JSON.parse(text)
        : {};
  } catch {
    throw new Error(
      `Server trả dữ liệu không hợp lệ. HTTP ${response.status}`
    );
  }
  if (!response.ok) {
    throw new Error(
      data?.error ||
      `Server HTTP ${response.status}`
    );
  }
  return data;
}
/* ==================================================
   CREATE JOB
================================================== */
async function createJob(message) {
  return requestJSON(
    `${API_URL}/chat`,
    {
      method: "POST",
      headers: {
        "Content-Type":
          "application/json"
      },
      body: JSON.stringify({
        message,
        history:
          history.slice(-20)
      })
    }
  );
}
/* ==================================================
   GET JOB
================================================== */
async function getJob(jobId) {
  return requestJSON(
    `${API_URL}/job/${encodeURIComponent(jobId)}`,
    {
      method: "GET"
    }
  );
}
/* ==================================================
   WAIT JOB
================================================== */
async function waitForJob(
  jobId,
  thinkingElement
) {
  /*
   * Không giới hạn thời gian quá ngắn.
   *
   * Nếu app bị đóng:
   * Worker vẫn tiếp tục xử lý.
   *
   * Khi mở lại:
   * jobId được lấy từ localStorage
   * và tiếp tục kiểm tra.
   */
  while (true) {
    let data;
    try {
      data =
        await getJob(jobId);
    } catch (error) {
      console.warn(
        "JOB CHECK:",
        error
      );
      if (thinkingElement) {
        thinkingElement.textContent =
          "Đang kết nối lại HungAI...";
      }
      await sleep(3000);
      continue;
    }
    if (
      data.status === "completed"
    ) {
      return data.reply || "";
    }
    if (
      data.status === "failed"
    ) {
      throw new Error(
        data.error ||
        "HungAI xử lý thất bại."
      );
    }
    if (thinkingElement) {
      if (
        data.status === "processing"
      ) {
        thinkingElement.textContent =
          "HungAI đang suy nghĩ...";
      } else {
        thinkingElement.textContent =
          "HungAI đang xử lý...";
      }
    }
    await sleep(1500);
  }
}
/* ==================================================
   SLEEP
================================================== */
function sleep(ms) {
  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}
/* ==================================================
   COMPLETE JOB
================================================== */
function finishPendingJob(
  jobId,
  message,
  reply
) {
  /*
   * Lưu cả user + AI.
   */
  history.push({
    role: "user",
    content: message
  });
  history.push({
    role: "assistant",
    content: reply
  });
  saveHistory();
  /*
   * Xóa job khỏi danh sách đang chờ.
   */
  pendingJobs =
    pendingJobs.filter(
      job =>
        job.jobId !== jobId
    );
  savePendingJobs();
}
/* ==================================================
   SEND
================================================== */
async function sendMessage() {
  if (sending) {
    return;
  }
  const message =
    input.value.trim();
  if (!message) {
    return;
  }
  sending = true;
  send.disabled = true;
  /*
   * Hiện tin nhắn người dùng.
   */
  addMessage(
    message,
    "user"
  );
  input.value = "";
  /*
   * Thinking.
   */
  const thinking =
    addMessage(
      "HungAI đang tạo nhiệm vụ...",
      "ai",
      "thinking"
    );
  try {
    /*
     * Tạo job trên Worker.
     */
    const job =
      await createJob(message);
    if (!job.jobId) {
      throw new Error(
        "Worker không trả jobId."
      );
    }
    /*
     * LƯU NGAY JOB.
     *
     * Đây là phần cực kỳ quan trọng.
     *
     * Sau khi job được tạo,
     * người dùng có thể đóng app.
     */
    pendingJobs.push({
      jobId: job.jobId,
      message,
      createdAt: Date.now()
    });
    savePendingJobs();
    /*
     * Worker xử lý độc lập.
     */
    const reply =
      await waitForJob(
        job.jobId,
        thinking
      );
    /*
     * Xóa thinking.
     */
    thinking.remove();
    /*
     * Lưu hội thoại.
     */
    finishPendingJob(
      job.jobId,
      message,
      reply
    );
    /*
     * Hiện câu trả lời.
     */
    addMessage(
      reply,
      "ai"
    );
  } catch (error) {
    console.error(
      "SEND ERROR:",
      error
    );
    thinking.remove();
    /*
     * Nếu job đã được tạo nhưng
     * mạng bị mất sau đó,
     * KHÔNG xóa job.
     *
     * Khi mở lại app,
     * resumePendingJobs()
     * sẽ tiếp tục lấy kết quả.
     */
    addMessage(
      "Không thể kết nối lúc này. Nếu job đã được tạo, HungAI vẫn sẽ tiếp tục xử lý.",
      "error"
    );
  } finally {
    sending = false;
    send.disabled = false;
    input.focus();
  }
}
/* ==================================================
   RESUME JOBS
================================================== */
async function resumePendingJobs() {
  if (!pendingJobs.length) {
    return;
  }
  /*
   * Sao chép danh sách để tránh
   * thay đổi trong lúc đang duyệt.
   */
  const jobs =
    [...pendingJobs];
  for (const job of jobs) {
    /*
     * Kiểm tra job còn tồn tại không.
     */
    const thinking =
      addMessage(
        "Đang khôi phục câu trả lời...",
        "ai",
        "thinking"
      );
    try {
      const reply =
        await waitForJob(
          job.jobId,
          thinking
        );
      thinking.remove();
      /*
       * Chỉ thêm lịch sử nếu chưa có
       * chính xác cặp tin nhắn này.
       */
      const exists =
        history.some(
          item =>
            item.role === "user" &&
            item.content === job.message
        );
      if (!exists) {
        finishPendingJob(
          job.jobId,
          job.message,
          reply
        );
      } else {
        pendingJobs =
          pendingJobs.filter(
            item =>
              item.jobId !==
              job.jobId
          );
        savePendingJobs();
      }
      addMessage(
        reply,
        "ai"
      );
    } catch (error) {
      thinking.remove();
      /*
       * Không xóa pending job.
       *
       * Lần mở app sau vẫn có thể
       * thử lại.
       */
      console.error(
        "RESUME ERROR:",
        error
      );
      addMessage(
        "Chưa lấy được câu trả lời. Job vẫn được giữ lại.",
        "error"
      );
    }
  }
}
/* ==================================================
   CLEAR
================================================== */
clear.addEventListener(
  "click",
  () => {
    history = [];
    pendingJobs = [];
    localStorage.removeItem(
      HISTORY_KEY
    );
    localStorage.removeItem(
      PENDING_KEY
    );
    renderChat();
    input.focus();
  }
);
/* ==================================================
   SEND BUTTON
================================================== */
send.addEventListener(
  "click",
  sendMessage
);
/* ==================================================
   ENTER
================================================== */
input.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);
/* ==================================================
   START
================================================== */
renderChat();
input.focus();
/*
 * Quan trọng:
 *
 * Nếu trước đó có tin nhắn đang xử lý,
 * lập tức khôi phục job.
 */
resumePendingJobs();
</script>
</body>
</html>
