<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>HungAI</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b0f14;
      color: white;
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #111720;
      border-bottom: 1px solid #252d38;
      font-size: 20px;
      font-weight: bold;
    }
    .status {
      margin-left: 10px;
      color: #4ade80;
      font-size: 12px;
      font-weight: normal;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
    }
    .ai {
      align-self: flex-start;
      background: #1b2430;
    }
    .error {
      align-self: flex-start;
      background: #7f1d1d;
    }
    .thinking {
      opacity: 0.7;
    }
    .bottom {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #111720;
      border-top: 1px solid #252d38;
    }
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border: 1px solid #303b48;
      border-radius: 14px;
      background: #0b0f14;
      color: white;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }
    textarea:focus {
      border-color: #2563eb;
    }
    button {
      width: 80px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
    button:disabled {
      opacity: 0.5;
    }
    .clear {
      width: auto;
      padding: 0 12px;
      background: #252d38;
      font-size: 12px;
    }
  </style>
</head>
<body>
<header>
  HungAI
  <span class="status">● Online</span>
</header>
<main id="chat"></main>
<div class="bottom">
  <textarea
    id="input"
    placeholder="Nhập tin nhắn..."
  ></textarea>
  <button
    id="clear"
    class="clear"
  >
    Xóa
  </button>
  <button
    id="send"
  >
    Gửi
  </button>
</div>
<script>
/* ==================================================
   CONFIG
================================================== */
const API_URL =
  "https://hungai-api.nemhung1122.workers.dev";
const STORAGE_KEY =
  "hungai_history";
const JOBS_KEY =
  "hungai_pending_jobs";
/* ==================================================
   ELEMENTS
================================================== */
const chat =
  document.getElementById("chat");
const input =
  document.getElementById("input");
const send =
  document.getElementById("send");
const clear =
  document.getElementById("clear");
/* ==================================================
   HISTORY
================================================== */
let history =
  loadHistory();
function loadHistory() {
  try {
    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );
    if (!raw) {
      return [];
    }
    const data =
      JSON.parse(raw);
    if (!Array.isArray(data)) {
      return [];
    }
    return data
      .filter(item =>
        item &&
        (
          item.role === "user" ||
          item.role === "assistant"
        ) &&
        typeof item.content === "string"
      )
      .slice(-100);
  } catch (error) {
    console.error(
      "LOAD HISTORY ERROR:",
      error
    );
    return [];
  }
}
function saveHistory() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(
        history.slice(-100)
      )
    );
  } catch (error) {
    console.error(
      "SAVE HISTORY ERROR:",
      error
    );
  }
}
/* ==================================================
   PENDING JOBS
================================================== */
function loadPendingJobs() {
  try {
    const raw =
      localStorage.getItem(
        JOBS_KEY
      );
    if (!raw) {
      return [];
    }
    const data =
      JSON.parse(raw);
    return Array.isArray(data)
      ? data
      : [];
  } catch {
    return [];
  }
}
function savePendingJobs(jobs) {
  try {
    localStorage.setItem(
      JOBS_KEY,
      JSON.stringify(jobs)
    );
  } catch (error) {
    console.error(
      "SAVE JOB ERROR:",
      error
    );
  }
}
let pendingJobs =
  loadPendingJobs();
/* ==================================================
   MESSAGE UI
================================================== */
function addMessage(
  text,
  type,
  extraClass = ""
) {
  const div =
    document.createElement("div");
  div.className =
    `message ${type} ${extraClass}`;
  div.textContent =
    String(text ?? "");
  chat.appendChild(div);
  chat.scrollTop =
    chat.scrollHeight;
  return div;
}
/* ==================================================
   LOAD CHAT
================================================== */
function loadChat() {
  chat.innerHTML = "";
  if (
    !history.length
  ) {
    addMessage(
      "Xin chào! Mình là HungAI. 👋",
      "ai"
    );
    return;
  }
  for (
    const item of history
  ) {
    addMessage(
      item.content,
      item.role === "user"
        ? "user"
        : "ai"
    );
  }
}
/* ==================================================
   API
================================================== */
async function apiFetch(
  url,
  options = {}
) {
  const response =
    await fetch(
      url,
      {
        cache: "no-store",
        ...options
      }
    );
  const text =
    await response.text();
  let data;
  try {
    data =
      text
        ? JSON.parse(text)
        : {};
  } catch {
    throw new Error(
      `Worker trả dữ liệu không hợp lệ. HTTP ${response.status}`
    );
  }
  if (!response.ok) {
    throw new Error(
      data?.error ||
      `Worker HTTP ${response.status}`
    );
  }
  return data;
}
/* ==================================================
   CREATE JOB
================================================== */
async function createJob(
  message
) {
  const data =
    await apiFetch(
      `${API_URL}/chat`,
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify({
            message,
            history:
              history.slice(-20)
          })
      }
    );
  if (
    !data.jobId
  ) {
    throw new Error(
      "Worker không trả jobId."
    );
  }
  return data;
}
/* ==================================================
   GET JOB
================================================== */
async function getJob(
  jobId
) {
  return apiFetch(
    `${API_URL}/job/${encodeURIComponent(jobId)}`,
    {
      method: "GET"
    }
  );
}
/* ==================================================
   WAIT FOR JOB
================================================== */
async function waitForJob(
  jobId,
  thinkingElement
) {
  const MAX_TIME =
    5 * 60 * 1000;
  const started =
    Date.now();
  while (
    Date.now() - started <
    MAX_TIME
  ) {
    let data;
    try {
      data =
        await getJob(
          jobId
        );
    } catch (error) {
      /*
       * Mất mạng tạm thời.
       * Không làm mất job.
       */
      console.warn(
        "JOB CHECK ERROR:",
        error
      );
      await sleep(3000);
      continue;
    }
    /* ==========================
       COMPLETED
    ========================== */
    if (
      data.status ===
      "completed"
    ) {
      if (
        thinkingElement
      ) {
        thinkingElement.remove();
      }
      return data.reply || "";
    }
    /* ==========================
       FAILED
    ========================== */
    if (
      data.status ===
      "failed"
    ) {
      if (
        thinkingElement
      ) {
        thinkingElement.remove();
      }
      throw new Error(
        data.error ||
        "HungAI xử lý thất bại."
      );
    }
    /* ==========================
       QUEUED / PROCESSING
    ========================== */
    if (
      thinkingElement
    ) {
      thinkingElement.textContent =
        data.status ===
        "processing"
          ? "HungAI đang xử lý..."
          : "HungAI đang chờ xử lý...";
    }
    await sleep(1500);
  }
  throw new Error(
    "HungAI xử lý quá lâu."
  );
}
/* ==================================================
   SLEEP
================================================== */
function sleep(
  ms
) {
  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}
/* ==================================================
   SEND MESSAGE
================================================== */
async function sendMessage() {
  const message =
    input.value.trim();
  if (
    !message ||
    send.disabled
  ) {
    return;
  }
  /* ==========================
     USER MESSAGE
  ========================== */
  addMessage(
    message,
    "user"
  );
  input.value = "";
  send.disabled = true;
  /* ==========================
     THINKING
  ========================== */
  const thinking =
    addMessage(
      "HungAI đang tạo nhiệm vụ...",
      "ai",
      "thinking"
    );
  try {
    /*
     * Tạo job.
     * Sau bước này Worker tự xử lý.
     */
    const job =
      await createJob(
        message
      );
    /*
     * Lưu job ngay vào localStorage.
     *
     * Đây là phần quan trọng:
     * nếu người dùng thoát app,
     * jobId vẫn còn.
     */
    pendingJobs.push({
      jobId:
        job.jobId,
      message,
      createdAt:
        Date.now()
    });
    savePendingJobs(
      pendingJobs
    );
    /*
     * Chờ Worker xử lý.
     */
    const reply =
      await waitForJob(
        job.jobId,
        thinking
      );
    /*
     * Lưu hội thoại.
     */
    history.push({
      role: "user",
      content: message
    });
    history.push({
      role: "assistant",
      content: reply
    });
    saveHistory();
    /*
     * Xóa job đã hoàn thành.
     */
    pendingJobs =
      pendingJobs.filter(
        item =>
          item.jobId !==
          job.jobId
      );
    savePendingJobs(
      pendingJobs
    );
    /*
     * Hiện câu trả lời.
     */
    addMessage(
      reply,
      "ai"
    );
  } catch (error) {
    console.error(
      "HUNGAI SEND ERROR:",
      error
    );
    if (
      thinking
    ) {
      thinking.remove();
    }
    addMessage(
      "Lỗi: " +
      (
        error?.message ||
        "Không xác định."
      ),
      "error"
    );
  } finally {
    send.disabled = false;
    input.focus();
  }
}
/* ==================================================
   RESUME PENDING JOBS
================================================== */
async function resumePendingJobs() {
  if (
    !pendingJobs.length
  ) {
    return;
  }
  const jobs =
    [...pendingJobs];
  for (
    const job of jobs
  ) {
    /*
     * Không tạo message user lần nữa.
     *
     * Chỉ khôi phục trạng thái
     * đang chờ câu trả lời.
     */
    const thinking =
      addMessage(
        `Đang lấy câu trả lời cho: ${job.message}`,
        "ai",
        "thinking"
      );
    try {
      const reply =
        await waitForJob(
          job.jobId,
          thinking
        );
      /*
       * Kiểm tra tránh lưu trùng.
       */
      const alreadyExists =
        history.some(
          item =>
            item.role === "user" &&
            item.content ===
            job.message
        );
      if (
        !alreadyExists
      ) {
        history.push({
          role: "user",
          content: job.message
        });
        history.push({
          role: "assistant",
          content: reply
        });
        saveHistory();
      }
      /*
       * Xóa job hoàn thành.
       */
      pendingJobs =
        pendingJobs.filter(
          item =>
            item.jobId !==
            job.jobId
        );
      savePendingJobs(
        pendingJobs
      );
      addMessage(
        reply,
        "ai"
      );
    } catch (error) {
      if (
        thinking
      ) {
        thinking.remove();
      }
      addMessage(
        "Lỗi khi khôi phục: " +
        (
          error?.message ||
          "Không xác định."
        ),
        "error"
      );
    }
  }
}
/* ==================================================
   CLEAR
================================================== */
clear.addEventListener(
  "click",
  () => {
    history = [];
    pendingJobs = [];
    localStorage.removeItem(
      STORAGE_KEY
    );
    localStorage.removeItem(
      JOBS_KEY
    );
    loadChat();
    input.focus();
  }
);
/* ==================================================
   BUTTON
================================================== */
send.addEventListener(
  "click",
  sendMessage
);
/* ==================================================
   ENTER
================================================== */
input.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);
/* ==================================================
   START
================================================== */
loadChat();
input.focus();
/*
 * Khôi phục những job đang xử lý
 * sau khi mở lại trang/app.
 */
resumePendingJobs();
</script>
</body>
</html>
