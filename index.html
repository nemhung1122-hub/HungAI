<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HungAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: #0b0f14;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      background: #111720;
      border-bottom: 1px solid #252d38;
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      margin-left: 10px;
      font-size: 12px;
      color: #4ade80;
      font-weight: normal;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 15px;
      white-space: pre-wrap;
      line-height: 1.5;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
    }

    .ai {
      align-self: flex-start;
      background: #1b2430;
    }

    .error {
      background: #7f1d1d;
    }

    .bottom {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #111720;
      border-top: 1px solid #252d38;
    }

    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border: 1px solid #303b48;
      border-radius: 12px;
      background: #0b0f14;
      color: white;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    button {
      width: 80px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<header>
  HungAI
  <span class="status">● Online</span>
</header>

<main id="chat">
  <div class="message ai">
    Xin chào! Tôi là HungAI. 👋
  </div>
</main>

<div class="bottom">
  <textarea
    id="input"
    placeholder="Nhập tin nhắn..."
  ></textarea>

  <button id="send">Gửi</button>
</div>

<script>
  const API_URL =
    "https://hungai-api.nemhung1122.workers.dev";

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function addMessage(text, type) {
    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    return div;
  }

  async function sendMessage() {
    const message = input.value.trim();

    if (!message || send.disabled) {
      return;
    }

    addMessage(message, "user");

    input.value = "";
    send.disabled = true;

    const thinking = addMessage(
      "HungAI đang suy nghĩ...",
      "ai"
    );

    try {
      const response = await fetch(API_URL, {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message
        })
      });

      const data = await response.json();

      thinking.remove();

      if (!response.ok) {
        throw new Error(
          data.error || "Worker trả về lỗi."
        );
      }

      if (!data.reply) {
        throw new Error(
          "Worker không trả về nội dung."
        );
      }

      addMessage(data.reply, "ai");

    } catch (error) {

      thinking.remove();

      addMessage(
        "Lỗi: " + error.message,
        "ai error"
      );
    }

    send.disabled = false;
    input.focus();
  }

  send.addEventListener(
    "click",
    sendMessage
  );

  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        sendMessage();
      }

    }
  );
</script>

</body>
</html>
