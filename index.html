<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HungAI</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }
    body {
      background: #0b0f14;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 60px;
      min-height: 60px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #111720;
      border-bottom: 1px solid #252d38;
      font-size: 20px;
      font-weight: bold;
    }
    .status {
      margin-left: 10px;
      color: #4ade80;
      font-size: 12px;
      font-weight: normal;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .message {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
    }
    .ai {
      align-self: flex-start;
      background: #1b2430;
    }
    .error {
      align-self: flex-start;
      background: #7f1d1d;
    }
    .bottom {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #111720;
      border-top: 1px solid #252d38;
    }
    textarea {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border: 1px solid #303b48;
      border-radius: 14px;
      background: #0b0f14;
      color: #ffffff;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }
    textarea:focus {
      border-color: #2563eb;
    }
    button {
      width: 80px;
      min-width: 80px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .clear {
      width: auto;
      min-width: 55px;
      padding: 0 12px;
      background: #252d38;
      font-size: 12px;
    }
  </style>
</head>
<body>
<header>
  HungAI
  <span class="status">● Online</span>
</header>
<main id="chat"></main>
<div class="bottom">
  <textarea
    id="input"
    placeholder="Nhập tin nhắn..."
    autocomplete="off"
  ></textarea>
  <button
    id="clear"
    class="clear"
    type="button"
  >
    Xóa
  </button>
  <button
    id="send"
    type="button"
  >
    Gửi
  </button>
</div>
<script>
/*
 * ==========================================
 * CẤU HÌNH
 * ==========================================
 */
const API_URL =
  "https://hungai-api.nemhung1122.workers.dev/";
const STORAGE_KEY =
  "hungai_history";
const MAX_HISTORY =
  40;
const MAX_HISTORY_TO_SEND =
  12;
/*
 * ==========================================
 * DOM
 * ==========================================
 */
const chat =
  document.getElementById("chat");
const input =
  document.getElementById("input");
const send =
  document.getElementById("send");
const clear =
  document.getElementById("clear");
/*
 * ==========================================
 * LỊCH SỬ
 * ==========================================
 */
let history =
  loadHistory();
function loadHistory() {
  try {
    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );
    if (!raw) {
      return [];
    }
    const parsed =
      JSON.parse(raw);
    if (!Array.isArray(parsed)) {
      return [];
    }
    return parsed
      .filter(item => {
        return (
          item &&
          (
            item.role === "user" ||
            item.role === "assistant"
          ) &&
          typeof item.content === "string" &&
          item.content.trim().length > 0
        );
      })
      .slice(-MAX_HISTORY);
  } catch (error) {
    console.error(
      "HungAI: lỗi đọc lịch sử:",
      error
    );
    return [];
  }
}
function saveHistory() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(history)
    );
  } catch (error) {
    console.error(
      "HungAI: lỗi lưu lịch sử:",
      error
    );
  }
}
/*
 * ==========================================
 * HIỂN THỊ TIN NHẮN
 * ==========================================
 */
function addMessage(
  text,
  type
) {
  const div =
    document.createElement("div");
  div.className =
    "message " + type;
  div.textContent =
    String(text ?? "");
  chat.appendChild(div);
  chat.scrollTop =
    chat.scrollHeight;
  return div;
}
/*
 * ==========================================
 * LOAD CHAT
 * ==========================================
 */
function loadChat() {
  chat.innerHTML = "";
  if (
    !history.length
  ) {
    addMessage(
      "Xin chào! Mình là HungAI. 👋",
      "ai"
    );
    return;
  }
  for (
    const item of history
  ) {
    addMessage(
      item.content,
      item.role === "user"
        ? "user"
        : "ai"
    );
  }
}
/*
 * ==========================================
 * CHUẨN BỊ HISTORY
 * ==========================================
 */
function prepareHistory() {
  return history
    .filter(item => {
      return (
        item &&
        (
          item.role === "user" ||
          item.role === "assistant"
        ) &&
        typeof item.content === "string"
      );
    })
    .slice(-MAX_HISTORY_TO_SEND);
}
/*
 * ==========================================
 * GỌI WORKER
 * ==========================================
 */
async function callHungAI(
  message
) {
  console.log(
    "HungAI: gửi request..."
  );
  console.log(
    "HungAI URL:",
    API_URL
  );
  const response =
    await fetch(
      API_URL,
      {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          message:
            message,
          history:
            prepareHistory()
        })
      }
    );
  console.log(
    "HungAI HTTP status:",
    response.status
  );
  const raw =
    await response.text();
  console.log(
    "HungAI raw response:",
    raw
  );
  let data;
  try {
    data =
      raw
        ? JSON.parse(raw)
        : null;
  } catch (error) {
    throw new Error(
      `Worker trả về dữ liệu không hợp lệ. HTTP ${response.status}`
    );
  }
  /*
   * Worker trả lỗi HTTP
   */
  if (
    !response.ok
  ) {
    throw new Error(
      data?.error ||
      `Worker lỗi HTTP ${response.status}.`
    );
  }
  /*
   * Không có reply
   */
  if (
    !data ||
    typeof data.reply !== "string" ||
    !data.reply.trim()
  ) {
    console.error(
      "HungAI data:",
      data
    );
    throw new Error(
      data?.error ||
      "Worker chạy thành công nhưng không có câu trả lời."
    );
  }
  return data.reply;
}
/*
 * ==========================================
 * GỬI TIN NHẮN
 * ==========================================
 */
async function sendMessage() {
  const message =
    input.value.trim();
  if (
    !message ||
    send.disabled
  ) {
    return;
  }
  /*
   * Hiển thị câu hỏi
   */
  addMessage(
    message,
    "user"
  );
  input.value = "";
  send.disabled = true;
  /*
   * Hiển thị trạng thái
   */
  const thinking =
    addMessage(
      "HungAI đang suy nghĩ...",
      "ai"
    );
  try {
    /*
     * Gọi Worker
     */
    const reply =
      await callHungAI(
        message
      );
    /*
     * Xóa trạng thái
     */
    thinking.remove();
    /*
     * Hiển thị câu trả lời
     */
    addMessage(
      reply,
      "ai"
    );
    /*
     * Lưu lịch sử
     */
    history.push({
      role: "user",
      content: message
    });
    history.push({
      role: "assistant",
      content: reply
    });
    /*
     * Giới hạn lịch sử
     */
    if (
      history.length >
      MAX_HISTORY
    ) {
      history =
        history.slice(
          -MAX_HISTORY
        );
    }
    saveHistory();
  } catch (error) {
    thinking.remove();
    console.error(
      "HungAI ERROR:",
      error
    );
    /*
     * Hiện lỗi thật,
     * không giấu lỗi fetch nữa.
     */
    addMessage(
      "Lỗi: " +
      (
        error?.message ||
        "Không xác định."
      ),
      "error"
    );
  } finally {
    send.disabled = false;
    input.focus();
  }
}
/*
 * ==========================================
 * XÓA LỊCH SỬ
 * ==========================================
 */
clear.addEventListener(
  "click",
  function() {
    history = [];
    try {
      localStorage.removeItem(
        STORAGE_KEY
      );
    } catch (error) {
      console.error(
        error
      );
    }
    loadChat();
    input.focus();
  }
);
/*
 * ==========================================
 * NÚT GỬI
 * ==========================================
 */
send.addEventListener(
  "click",
  sendMessage
);
/*
 * ==========================================
 * ENTER
 * ==========================================
 */
input.addEventListener(
  "keydown",
  function(event) {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);
/*
 * ==========================================
 * KHỞI ĐỘNG
 * ==========================================
 */
loadChat();
input.focus();
</script>
</body>
</html>
