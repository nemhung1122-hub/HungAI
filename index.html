<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>HungAI</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b0f14;
      color: white;
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #111720;
      border-bottom: 1px solid #252d38;
      font-size: 20px;
      font-weight: bold;
    }
    .status {
      margin-left: 10px;
      color: #4ade80;
      font-size: 12px;
      font-weight: normal;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
    }
    .ai {
      align-self: flex-start;
      background: #1b2430;
    }
    .error {
      align-self: flex-start;
      background: #7f1d1d;
    }
    .thinking {
      opacity: 0.7;
    }
    .bottom {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #111720;
      border-top: 1px solid #252d38;
    }
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border: 1px solid #303b48;
      border-radius: 14px;
      background: #0b0f14;
      color: white;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }
    textarea:focus {
      border-color: #2563eb;
    }
    button {
      width: 80px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
    button:disabled {
      opacity: 0.5;
    }
    .clear {
      width: auto;
      padding: 0 12px;
      background: #252d38;
      font-size: 12px;
    }
  </style>
</head>
<body>
<header>
  HungAI
  <span class="status">● Online</span>
</header>
<main id="chat"></main>
<div class="bottom">
  <textarea
    id="input"
    placeholder="Nhập tin nhắn..."
  ></textarea>
  <button
    id="clear"
    class="clear"
  >
    Xóa
  </button>
  <button
    id="send"
  >
    Gửi
  </button>
</div>
<script>
"use strict";
/* ==================================================
   CONFIG
================================================== */
const API_URL =
  "https://hungai-api.nemhung1122.workers.dev";
const HISTORY_KEY =
  "hungai_history_v2";
const PENDING_KEY =
  "hungai_pending_v2";
/* ==================================================
   ELEMENTS
================================================== */
const chat =
  document.getElementById("chat");
const input =
  document.getElementById("input");
const send =
  document.getElementById("send");
const clear =
  document.getElementById("clear");
/* ==================================================
   HISTORY
================================================== */
let history =
  loadHistory();
function loadHistory() {
  try {
    const raw =
      localStorage.getItem(
        HISTORY_KEY
      );
    if (!raw) {
      return [];
    }
    const data =
      JSON.parse(raw);
    if (!Array.isArray(data)) {
      return [];
    }
    return data
      .filter(item => {
        return (
          item &&
          (
            item.role === "user" ||
            item.role === "assistant"
          ) &&
          typeof item.content === "string"
        );
      })
      .slice(-100);
  } catch (error) {
    console.error(
      "HISTORY LOAD ERROR:",
      error
    );
    return [];
  }
}
function saveHistory() {
  try {
    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(
        history.slice(-100)
      )
    );
  } catch (error) {
    console.error(
      "HISTORY SAVE ERROR:",
      error
    );
  }
}
/* ==================================================
   PENDING JOBS
================================================== */
let pendingJobs =
  loadPendingJobs();
function loadPendingJobs() {
  try {
    const raw =
      localStorage.getItem(
        PENDING_KEY
      );
    if (!raw) {
      return [];
    }
    const data =
      JSON.parse(raw);
    return Array.isArray(data)
      ? data
      : [];
  } catch (error) {
    console.error(
      "PENDING LOAD ERROR:",
      error
    );
    return [];
  }
}
function savePendingJobs() {
  try {
    localStorage.setItem(
      PENDING_KEY,
      JSON.stringify(
        pendingJobs
      )
    );
  } catch (error) {
    console.error(
      "PENDING SAVE ERROR:",
      error
    );
  }
}
/* ==================================================
   UI
================================================== */
function addMessage(
  text,
  type,
  extra = ""
) {
  const div =
    document.createElement(
      "div"
    );
  div.className =
    `message ${type} ${extra}`;
  div.textContent =
    String(text ?? "");
  chat.appendChild(div);
  chat.scrollTop =
    chat.scrollHeight;
  return div;
}
/* ==================================================
   LOAD CHAT
================================================== */
function renderChat() {
  chat.innerHTML = "";
  if (!history.length) {
    addMessage(
      "Xin chào! Mình là HungAI. 👋",
      "ai"
    );
    return;
  }
  for (
    const item of history
  ) {
    addMessage(
      item.content,
      item.role === "user"
        ? "user"
        : "ai"
    );
  }
}
/* ==================================================
   API FETCH
================================================== */
async function apiFetch(
  url,
  options = {}
) {
  const response =
    await fetch(
      url,
      {
        cache: "no-store",
        ...options
      }
    );
  const text =
    await response.text();
  let data = {};
  try {
    data =
      text
        ? JSON.parse(text)
        : {};
  } catch {
    throw new Error(
      `Worker trả dữ liệu không hợp lệ. HTTP ${response.status}`
    );
  }
  if (!response.ok) {
    throw new Error(
      data?.error ||
      `Worker HTTP ${response.status}`
    );
  }
  return data;
}
/* ==================================================
   CREATE JOB
================================================== */
async function createJob(
  job
) {
  return apiFetch(
    `${API_URL}/chat`,
    {
      method: "POST",
      headers: {
        "Content-Type":
          "application/json"
      },
      body:
        JSON.stringify({
          jobId: job.jobId,
          message: job.message,
          history:
            job.history
        })
    }
  );
}
/* ==================================================
   GET JOB
================================================== */
async function getJob(
  jobId
) {
  return apiFetch(
    `${API_URL}/job/${encodeURIComponent(jobId)}`,
    {
      method: "GET"
    }
  );
}
/* ==================================================
   SLEEP
================================================== */
function sleep(ms) {
  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}
/* ==================================================
   WAIT JOB
================================================== */
async function waitForJob(
  jobId,
  thinking
) {
  /*
   * Không có giới hạn 5 phút.
   *
   * Job nằm ở Cloudflare.
   * App có thể đóng rồi mở lại.
   */
  while (true) {
    let data;
    try {
      data =
        await getJob(
          jobId
        );
    } catch (error) {
      /*
       * Mất mạng tạm thời.
       *
       * Không xóa job.
       */
      console.warn(
        "JOB POLL ERROR:",
        error
      );
      if (thinking) {
        thinking.textContent =
          "Đang kết nối lại với HungAI...";
      }
      await sleep(4000);
      continue;
    }
    /* ==============================
       COMPLETED
    ============================== */
    if (
      data.status ===
      "completed"
    ) {
      if (thinking) {
        thinking.remove();
      }
      return data.reply || "";
    }
    /* ==============================
       FAILED
    ============================== */
    if (
      data.status ===
      "failed"
    ) {
      if (thinking) {
        thinking.remove();
      }
      throw new Error(
        data.error ||
        "HungAI xử lý thất bại."
      );
    }
    /* ==============================
       PROCESSING
    ============================== */
    if (
      data.status ===
      "processing"
    ) {
      if (thinking) {
        thinking.textContent =
          "HungAI đang suy nghĩ...";
      }
    }
    /* ==============================
       QUEUED
    ============================== */
    else {
      if (thinking) {
        thinking.textContent =
          "HungAI đang xử lý...";
      }
    }
    await sleep(1500);
  }
}
/* ==================================================
   ADD HISTORY
================================================== */
function addToHistory(
  userMessage,
  reply
) {
  history.push({
    role: "user",
    content: userMessage
  });
  history.push({
    role: "assistant",
    content: reply
  });
  history =
    history.slice(-100);
  saveHistory();
}
/* ==================================================
   REMOVE PENDING
================================================== */
function removePending(
  jobId
) {
  pendingJobs =
    pendingJobs.filter(
      job =>
        job.jobId !== jobId
    );
  savePendingJobs();
}
/* ==================================================
   SEND
================================================== */
async function sendMessage() {
  const message =
    input.value.trim();
  if (
    !message ||
    send.disabled
  ) {
    return;
  }
  /*
   * Tạo ID NGAY LẬP TỨC.
   */
  const jobId =
    crypto.randomUUID();
  /*
   * Lưu job LOCAL TRƯỚC khi
   * gọi Worker.
   *
   * Nếu app bị đóng sau đó,
   * ID vẫn còn.
   */
  const job = {
    jobId,
    message,
    history:
      history.slice(-20),
    createdAt:
      Date.now()
  };
  pendingJobs.push(job);
  savePendingJobs();
  /* ==============================
     UI
  ============================== */
  addMessage(
    message,
    "user"
  );
  input.value = "";
  send.disabled = true;
  const thinking =
    addMessage(
      "Đang gửi tới HungAI...",
      "ai",
      "thinking"
    );
  try {
    /*
     * Tạo job trên Cloudflare.
     */
    await createJob(
      job
    );
    /*
     * Từ thời điểm này:
     *
     * app có thể đóng.
     *
     * Cloudflare vẫn giữ job.
     */
    thinking.textContent =
      "HungAI đang xử lý...";
    const reply =
      await waitForJob(
        jobId,
        thinking
      );
    /*
     * Lưu hội thoại.
     */
    addToHistory(
      message,
      reply
    );
    /*
     * Xóa job hoàn thành.
     */
    removePending(
      jobId
    );
    /*
     * Hiện câu trả lời.
     */
    addMessage(
      reply,
      "ai"
    );
  } catch (error) {
    console.error(
      "SEND ERROR:",
      error
    );
    if (thinking) {
      thinking.remove();
    }
    /*
     * Không xóa pending job khi
     * chỉ bị lỗi mạng.
     *
     * Khi mở lại app nó vẫn thử lại.
     */
    addMessage(
      "Không thể kết nối lúc này. Job vẫn được giữ lại để khôi phục.",
      "error"
    );
  } finally {
    send.disabled =
      false;
    input.focus();
  }
}
/* ==================================================
   RESUME
================================================== */
async function resumePendingJobs() {
  const jobs =
    [...pendingJobs];
  if (!jobs.length) {
    return;
  }
  for (
    const job of jobs
  ) {
    const thinking =
      addMessage(
        `Đang khôi phục: ${job.message}`,
        "ai",
        "thinking"
      );
    try {
      /*
       * Có thể job đã tồn tại
       * trên Cloudflare.
       *
       * Nếu chưa gửi thành công,
       * gửi lại cùng jobId.
       *
       * Worker chống duplicate.
       */
      try {
        await createJob(
          job
        );
      } catch (error) {
        console.warn(
          "RESEND JOB:",
          error
        );
      }
      const reply =
        await waitForJob(
          job.jobId,
          thinking
        );
      /*
       * Kiểm tra trùng.
       */
      const duplicate =
        history.some(
          item =>
            item.role === "user" &&
            item.content ===
              job.message
        );
      if (!duplicate) {
        addToHistory(
          job.message,
          reply
        );
      }
      removePending(
        job.jobId
      );
      addMessage(
        reply,
        "ai"
      );
    } catch (error) {
      console.error(
        "RESUME ERROR:",
        error
      );
      if (thinking) {
        thinking.remove();
      }
      /*
       * Không xóa pending.
       *
       * Lần mở app tiếp theo
       * sẽ tiếp tục thử.
       */
      addMessage(
        "HungAI chưa lấy được câu trả lời. Mình sẽ giữ nhiệm vụ này.",
        "error"
      );
    }
  }
}
/* ==================================================
   CLEAR
================================================== */
clear.addEventListener(
  "click",
  () => {
    history = [];
    pendingJobs = [];
    localStorage.removeItem(
      HISTORY_KEY
    );
    localStorage.removeItem(
      PENDING_KEY
    );
    renderChat();
    input.focus();
  }
);
/* ==================================================
   SEND BUTTON
================================================== */
send.addEventListener(
  "click",
  sendMessage
);
/* ==================================================
   ENTER
================================================== */
input.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);
/* ==================================================
   START
================================================== */
renderChat();
input.focus();
/*
 * Quan trọng:
 *
 * Khi index.html mở lại,
 * các job cũ được khôi phục.
 */
resumePendingJobs();
</script>
</body>
</html>
